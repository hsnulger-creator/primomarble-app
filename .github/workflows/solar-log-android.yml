name: Solar Log Android APK

on:
  push:
    branches: [claude/solar-panel-log-app-3yk1am]
    paths:
      - 'solar-log/**'
      - '.github/workflows/solar-log-android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: solar-log
    env:
      EXPO_NO_TELEMETRY: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests
        run: npm test

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: solar-log/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: solar-log-apk
          path: solar-log/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
